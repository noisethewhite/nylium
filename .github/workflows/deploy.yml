name: Deploy

# Deploys to atos after CI is green on main: rsync the tree, sync the
# venv, restart the user unit, probe the SPA. Secrets: ATOS_SSH_KEY
# (ed25519 private key), ATOS_HOST, ATOS_USER.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ATOS_SSH_KEY }}" > ~/.ssh/atos_ed25519
          chmod 600 ~/.ssh/atos_ed25519
          ssh-keyscan -H "${{ vars.ATOS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to atos
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude .venv \
            --exclude node_modules \
            --exclude .env \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude .ruff_cache \
            -e "ssh -i ~/.ssh/atos_ed25519" \
            ./ "${{ vars.ATOS_USER }}@${{ vars.ATOS_HOST }}:~/services/nylium/"

      - name: Restart and healthcheck
        run: |
          ssh -i ~/.ssh/atos_ed25519 "${{ vars.ATOS_USER }}@${{ vars.ATOS_HOST }}" '
            set -e
            cd ~/services/nylium
            uv sync --frozen
            systemctl --user restart nylium
            for i in $(seq 1 15); do
              sleep 1
              if curl -fsS -o /dev/null http://127.0.0.1:8474/; then
                exit 0
              fi
            done
            echo "nylium did not come up" >&2
            systemctl --user status nylium --no-pager >&2 || true
            exit 1
          '
