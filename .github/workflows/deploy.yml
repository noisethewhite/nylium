name: Deploy

# Deploys to personal_vps after CI is green on main: rsync the tree, sync the
# venv, restart the system unit, probe the SPA. Secrets: VPS_SSH_KEY
# (ed25519 private key). Vars: VPS_HOST, VPS_USER.
# Data lives on the VPS: Postgres at /var/lib/postgresql, .env at
# /opt/nylium/.env (excluded from rsync).

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_ed25519
          chmod 600 ~/.ssh/vps_ed25519
          ssh-keyscan -H "${{ vars.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync to VPS
        run: |
          rsync -az --delete \
            --exclude .git \
            --exclude .venv \
            --exclude node_modules \
            --exclude .env \
            --exclude __pycache__ \
            --exclude .pytest_cache \
            --exclude .ruff_cache \
            -e "ssh -i ~/.ssh/vps_ed25519" \
            ./ "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/tmp/nylium-stage/"
          ssh -i ~/.ssh/vps_ed25519 "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" '
            set -e
            rsync -a --delete --exclude .env /tmp/nylium-stage/ /opt/nylium/
            rm -rf /tmp/nylium-stage
          '

      - name: Restart and healthcheck
        run: |
          ssh -i ~/.ssh/vps_ed25519 "${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}" '
            set -e
            export PATH=$HOME/.local/bin:$PATH
            cd /opt/nylium
            uv sync --frozen
            systemctl restart nylium
            for i in $(seq 1 15); do
              sleep 1
              if curl -fsS -o /dev/null http://127.0.0.1:8474/; then
                exit 0
              fi
            done
            echo "nylium did not come up" >&2
            systemctl status nylium --no-pager >&2 || true
            exit 1
          '
