[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nylium"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.52",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "python-dotenv==1.2.3",
    "uvicorn[standard]>=0.52.4",
    "webauthn>=2.3",
]
authors = [{ name = "Noise The White", email = "me@noisethewhite.dev" }]
description = "Write description later."
readme = "README.md"

[project.urls]
Repository = "https://github.com/noisethewhite/nylium.git"

[project.scripts]
nylium = "nylium.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Gate scope is src: tests use the declarative WObject DSL (class-level
# prop declarations) that static analysis cannot see through; pytest is
# their gate.
[tool.basedpyright]
include = ["src"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
