[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nylium"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0.52",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "python-dotenv==1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.4",
    "webauthn>=2.3",
]
authors = [{ name = "Noise The White", email = "me@noisethewhite.dev" }]
description = "Write description later."
readme = "README.md"

[project.urls]
Repository = "https://github.com/noisethewhite/nylium.git"

[project.scripts]
nylium = "nylium.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Gate scope covers src and tests. Tests run under a dedicated execution
# environment (below): the declarative WObject DSL (class-level prop
# declarations materialized by the metaclass at runtime) and strict-mode
# unknown-type reporting are structural false positives there, so the
# test profile relaxes them while keeping real checks (argument types,
# optional member access) active.
[tool.basedpyright]
include = ["src", "tests"]
# Analyze as the oldest supported interpreter (CI runs 3.12): local runs on
# newer Pythons must not hide errors like eager class-body annotations.
pythonVersion = "3.12"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
# WObject subclasses declare props as bare class-body annotations; the
# metaclass turns them into runtime accessors static analysis cannot see.
reportUninitializedInstanceVariable = false
reportAttributeAccessIssue = false
# Strict-mode unknown-type noise: test helpers are deliberately untyped.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportUnknownArgumentType = false
reportMissingParameterType = false
reportAny = false
reportExplicitAny = false
# Tests call mutating API methods for side effects; results are often
# intentionally discarded (or their effect is asserted via a reload).
reportUnusedCallResult = false
# Fixtures and helpers legitimately go unused in single files; tests may
# poke private seams to set up scenarios the public API cannot reach.
reportUnusedParameter = false
reportUnusedFunction = false
reportUnusedVariable = false
reportUnusedClass = false
reportPrivateUsage = false

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["PLC0415"]
