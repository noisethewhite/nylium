services:
  db:
    image: postgres:17-alpine
    container_name: nylium-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nylium
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nylium"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
